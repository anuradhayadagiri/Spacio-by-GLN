<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spacio by GLN</title>
    <meta
      name="description"
      content="Spacio by GLN - book spaces, stays, dining, parking, wellness and experiences."
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #121826;
        background: #f7f7f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(30, 64, 175, 0.12), transparent 34%),
          linear-gradient(315deg, rgba(22, 163, 74, 0.13), transparent 38%),
          #f7f7f4;
      }

      main {
        width: min(720px, 100%);
        border: 1px solid rgba(18, 24, 38, 0.1);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        padding: clamp(28px, 5vw, 56px);
        box-shadow: 0 20px 70px rgba(18, 24, 38, 0.1);
      }

      .mark {
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: #1e40af;
        color: #fff;
        font-weight: 800;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 8vw, 68px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 18px 0 0;
        max-width: 58ch;
        color: #4b5563;
        font-size: clamp(16px, 2.4vw, 19px);
        line-height: 1.6;
      }

      .status {
        margin-top: 28px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(22, 163, 74, 0.24);
        border-radius: 999px;
        padding: 10px 14px;
        color: #166534;
        background: rgba(220, 252, 231, 0.72);
        font-size: 14px;
        font-weight: 700;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #16a34a;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">S</div>
      <h1>Spacio by GLN</h1>
      <p>
        Book spaces, stays, dining, parking, wellness and experiences from one premium platform.
      </p>
      <div class="status"><span class="dot"></span>Deployment fallback is live</div>
    </main>
  </body>
</html>
